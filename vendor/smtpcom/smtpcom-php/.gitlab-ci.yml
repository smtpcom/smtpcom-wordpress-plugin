php:test:
  parallel:
    matrix:
      - PHP_VERSION: ["8.3", "8.4", "8.5"]
  before_script:
    - bash .gitlab-ci.sh
  image: php:${PHP_VERSION}-cli
  script:
    - php vendor/bin/phpcs --encoding=utf8
    - php vendor/bin/phpunit --no-coverage
    - php vendor/bin/phpstan
    - php vendor/bin/psalm.phar
