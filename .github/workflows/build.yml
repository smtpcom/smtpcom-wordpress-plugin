name: Build plugin zip

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lowest PHP version the plugin supports (readme.txt "Requires PHP"; platform_check.php needs >= 7.2.5).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.2'
          tools: composer:v2

      - name: Check that the tag matches the plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^ \* Version: *//p' smtp-com-mail.php)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin version $version" >&2
            exit 1
          fi

      - name: Build zip
        id: build
        run: echo "zip=$(bin/build-zip.sh dist | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Smoke test the bundled autoloader
        run: |
          mkdir smoke && unzip -q "${{ steps.build.outputs.zip }}" -d smoke
          php -r '
            require "smoke/smtp-com-mail/vendor/autoload.php";
            foreach (["SmtpSdk\\SmtpSdk", "Nyholm\\Psr7\\Request", "Buzz\\Client\\Curl"] as $class) {
                if (!class_exists($class)) { fwrite(STDERR, "Missing class $class\n"); exit(1); }
            }
            echo "Autoloader OK\n";
          '
          composer audit --locked --no-dev --abandoned=ignore

      - uses: actions/upload-artifact@v4
        with:
          name: smtp-com-mail
          path: ${{ steps.build.outputs.zip }}

      - name: Attach zip to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.zip }}
